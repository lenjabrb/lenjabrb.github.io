<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktiere uns</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kontaktiere uns</h1>
        <nav>

        </nav>
    </header>
    <main class="Kontakt-container">
        <h2>Wir freuen uns auf deine Nachricht!</h2>
        <p>Du hast Fragen oder möchtest Kontakt aufnehmen? Dann kannst du uns gerne eine Nachricht senden

    </p>
    <form class="kontakt-formular">
        <label for="name">Dein Name:</label>
        <input type="text" id="name" placeholder="Name eingeben"

        <label for="email">Deine E-Mail-Adresse:</label>
        <input type="email" id="email" placeholder="E-Mail eingeben">

        <label for="betreff">Betreff:</label>
        <input type="text" id="betreff" placeholder="Betreff eingeben">

        <label for="nachricht">Deine Nachricht:</label>
        <textarea id="nachricht" rows="6" placeholder="Schreibe deine Nachricht..."></textarea>

        <button type="submit">Nachricht senden</button>

    </form>

     </main>

    </body>
    </html>
