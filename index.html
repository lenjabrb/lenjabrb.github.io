  <section id="definition">
  <h2>Definition</h2>
  <figure>
    <blockquote cite="https://mailchimp.com/de/marketing-glossary/social-media-marketing/">
      <p>Social Media Marketing ist ein Marketing, bei dem soziale Medien zur Werbung für eine Marke, Produkte oder Dienstleistungen genutzt werden. Social Media Marketing ermöglicht es einer Marke, sich in laufende Konversationen auf Kanälen wie X (ehemals Twitter), Facebook und Instagram einzubinden. Zu den Best Practices für ein effektives Social Media Marketing gehören die Erstellung interessanter Inhalte, die auf deine Website verweisen, sowie die öffentliche Beantwortung von Fragen und Kommentaren.</p>
    </blockquote>
    <figcaption>
      Quelle: <cite>Segura, Ashley: Was ist Social Media Marketing?, Mailchimp</cite>,
      abgerufen am 05.11.2026.
    </figcaption>
  </figure>
</section>
